name: Daily Excerpt Push

on:
  schedule:
    # 北京时间每天 22:00（UTC 14:00）
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-excerpt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send daily excerpt
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python cloud_send_excerpt.py

      - name: Commit progress update
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 书摘进度.json
          git diff --cached --quiet || git commit -m "Update excerpt progress [skip ci]"
          git push
